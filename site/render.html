<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meridian Wire video frame</title>
<!-- The daily video is drawn from this page, one frame at a time, by pipeline/render.mjs.
     Nothing here runs on its own clock: seek(t) draws the frame for second t. -->
<style>
@font-face{font-family:"Big Shoulders Display";font-weight:600;src:url(fonts/big-shoulders-display-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Big Shoulders Display";font-weight:800;src:url(fonts/big-shoulders-display-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:400;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:500;src:url(fonts/ibm-plex-sans-latin-500-normal.woff2) format("woff2")}
:root{--bg:#0b0d10;--fg:#ece8e0;--muted:#8d949e;--accent:#ff8a1f;--ink:#1a0f04;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--body:"IBM Plex Sans",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);color:var(--fg)}
#map{position:absolute;inset:0}
.top{position:absolute;top:150px;left:64px;right:64px;display:flex;justify-content:space-between;align-items:baseline}
.brand{font:800 46px/1 var(--display);letter-spacing:.05em;text-transform:uppercase}
.brand span{color:var(--accent)}
.meta{font:500 24px/1.35 var(--mono);letter-spacing:.08em;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.meta b{display:block;color:var(--accent);font-weight:500}
/* Text stays clear of the app buttons on the right and the caption area at the bottom. */
.block{position:absolute;left:64px;right:156px;bottom:372px;display:flex;flex-direction:column;align-items:flex-start;gap:22px}
.tag{background:var(--accent);color:var(--ink);font:500 26px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:12px 16px}
h1{font:800 88px/.98 var(--display);letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.where{font:600 50px/1.05 var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.rule{width:100%;height:2px;background:var(--accent);transform-origin:left}
.cue{min-height:132px;font:500 40px/1.3 var(--body);text-wrap:balance}
.src{font:400 24px/1 var(--mono);letter-spacing:.06em;color:var(--muted);border:2px solid #3a424e;padding:11px 16px;border-radius:999px}
.src b{color:var(--fg);font-weight:500}
.end{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;justify-content:center;gap:28px;padding:0 156px 200px 64px;opacity:0}
.end .brand{font-size:120px;line-height:.95}
.end p{font:500 40px/1.3 var(--body);max-width:18ch}
.end .url{font:500 28px/1.3 var(--mono);color:var(--accent);overflow-wrap:anywhere}
</style>
</head>
<body>
<canvas id="map" width="1080" height="1920"></canvas>
<div class="top"><div class="brand" id="brand"></div><div class="meta"><span id="date"></span><b id="coord"></b></div></div>
<div class="block">
  <div class="tag" id="tag"></div>
  <h1 id="head"></h1>
  <div class="where" id="where"></div>
  <div class="rule" id="rule"></div>
  <p class="cue" id="cue"></p>
  <div class="src" id="src"></div>
</div>
<div class="end" id="end"><div class="brand" id="brand2"></div><p>Every story, on the globe.</p><div class="url" id="url"></div></div>

<script src="vendor/d3-array.min.js"></script>
<script src="vendor/d3-geo.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script>
const W = 1080, H = 1920, CX = 540, CY = 760;
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = (x) => { x = clamp(x, 0, 1); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const ramp = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
let S = null;

function brandHtml(el, name) {
  const [a, ...rest] = name.split(' ');
  el.textContent = a; if (rest.length) { const s = document.createElement('span'); s.textContent = rest.join(' '); el.append(s); }
}
function biggest(f) {   // largest landmass of a country, so far-off territories don't pull the camera
  if (f.geometry.type === 'Polygon') return f;
  let best = null, area = -1;
  for (const c of f.geometry.coordinates) { const p = { type: 'Feature', geometry: { type: 'Polygon', coordinates: c } }; const a = d3.geoArea(p); if (a > area) { area = a; best = p; } }
  return best;
}

window.setup = async function (d) {
  const feats = topojson.feature(d.topo, d.topo.objects.countries).features;
  const hot = d.countries.map((id) => feats.find((f) => String(f.id) === id)).filter(Boolean);
  const land = feats.filter((f) => !hot.includes(f));
  const main = hot.map(biggest);
  const cents = main.map((f) => d3.geoCentroid(f));
  let centre = cents[0] || [15, 30], extent = 0.5;
  if (cents.length) {
    const near = cents.filter((c) => d3.geoDistance(cents[0], c) < 1.0);
    centre = d3.geoCentroid({ type: 'MultiPoint', coordinates: [cents[0], ...near] });
    const b = d3.geoBounds(main[0]);
    extent = Math.max(...[[b[0][0], b[0][1]], [b[1][0], b[1][1]], [b[0][0], b[1][1]], [b[1][0], b[0][1]]].map((p) => d3.geoDistance(cents[0], p)));
    extent = Math.min(extent, 0.75);
    near.forEach((c) => { extent = Math.max(extent, d3.geoDistance(centre, c) + 0.08); });
  }
  const zoom = clamp(330 / Math.sin(clamp(extent, 0.08, 1.2)), 430, 1500);
  S = { d, hot, land, centre, zoom, grat: d3.geoGraticule10(), ctx: $('map').getContext('2d') };

  brandHtml($('brand'), d.brand); brandHtml($('brand2'), d.brand);
  $('date').textContent = d.dateLabel;
  $('coord').textContent = Math.abs(centre[1]).toFixed(1) + '°' + (centre[1] >= 0 ? 'N' : 'S') + ' ' + Math.abs(centre[0]).toFixed(1) + '°' + (centre[0] >= 0 ? 'E' : 'W');
  $('tag').textContent = d.label;
  $('head').textContent = d.headline;
  $('head').style.fontSize = (d.headline.length <= 26 ? 108 : d.headline.length <= 44 ? 90 : d.headline.length <= 62 ? 76 : 64) + 'px';
  $('where').textContent = d.places.join(' · ');
  $('src').textContent = 'Source  ';
  const b = document.createElement('b'); b.textContent = d.sources.join(', '); $('src').append(b);
  $('url').textContent = d.siteUrl.replace(/^https:\/\//, '');
  await document.fonts.ready;
  seek(0);
  return { duration: d.duration };
};

function show(el, p, dy) { el.style.opacity = p; el.style.transform = 'translateY(' + ((1 - p) * (dy || 24)) + 'px)'; }

window.seek = function (t) {
  const { d, ctx } = S;
  const arrive = ease(ramp(t, 0.2, 3.4));
  const lng = S.centre[0] - 75 * (1 - arrive) + 0.5 * Math.max(0, t - 3.4);
  const lat = S.centre[1] * arrive + 12 * (1 - arrive);
  const R = 430 + (S.zoom - 430) * ease(ramp(t, 0.9, 3.6));
  const proj = d3.geoOrthographic().translate([CX, CY]).scale(R).rotate([-lng, -lat * 0.85]).clipAngle(90).precision(0.4);
  const path = d3.geoPath(proj, ctx);

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0b0d10'; ctx.fillRect(0, 0, W, H);
  let g = ctx.createRadialGradient(CX, CY, R * 0.92, CX, CY, R * 1.16);          // atmosphere
  g.addColorStop(0, 'rgba(125,135,148,.34)'); g.addColorStop(1, 'rgba(125,135,148,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(CX, CY, R * 1.16, 0, 7); ctx.fill();
  g = ctx.createRadialGradient(CX - R * .3, CY - R * .35, R * .1, CX, CY, R);        // ocean
  g.addColorStop(0, '#1a2029'); g.addColorStop(1, '#0c1014');
  ctx.fillStyle = g; ctx.beginPath(); path({ type: 'Sphere' }); ctx.fill();
  ctx.strokeStyle = 'rgba(141,148,158,.13)'; ctx.lineWidth = 1; ctx.beginPath(); path(S.grat); ctx.stroke();
  ctx.fillStyle = '#2b313a'; ctx.strokeStyle = '#566070'; ctx.lineWidth = 1.2;
  ctx.beginPath(); S.land.forEach((f) => path(f)); ctx.fill(); ctx.stroke();

  const lit = ramp(t, 2.7, 3.7), pulse = 0.5 + 0.5 * Math.sin(t * 2.4);
  ctx.beginPath(); S.hot.forEach((f) => path(f));
  ctx.fillStyle = 'rgb(' + [43 + (255 - 43) * lit, 49 + (138 - 49) * lit, 58 + (31 - 58) * lit].map(Math.round).join(',') + ')';
  ctx.shadowColor = 'rgba(255,138,31,' + (0.55 * lit) + ')'; ctx.shadowBlur = 30 + 26 * pulse; ctx.fill(); ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,214,170,' + (0.35 + 0.65 * lit) + ')'; ctx.lineWidth = 1.2 + 1.8 * lit; ctx.stroke();

  g = ctx.createLinearGradient(0, 880, 0, 1240);                                  // fade into the text area
  g.addColorStop(0, 'rgba(11,13,16,0)'); g.addColorStop(1, 'rgba(11,13,16,.96)');
  ctx.fillStyle = g; ctx.fillRect(0, 880, W, H - 880);
  g = ctx.createLinearGradient(0, 0, 0, 300); g.addColorStop(0, 'rgba(11,13,16,.9)'); g.addColorStop(1, 'rgba(11,13,16,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 300);

  show($('tag'), ramp(t, 0.3, 0.7));
  show($('head'), ease(ramp(t, 0.6, 1.3)), 40);
  $('rule').style.transform = 'scaleX(' + ease(ramp(t, 1.0, 1.9)) + ')';
  show($('src'), ramp(t, 1.5, 2.0));
  show($('where'), ease(ramp(t, 2.9, 3.6)));
  const cue = d.cues.find((c) => t >= c.s && t < c.e);
  $('cue').textContent = cue ? cue.text : '';
  $('end').style.opacity = ramp(t, d.duration - 2.3, d.duration - 1.8);
};
</script>
</body>
</html>
