name: Daily edition

on:
  schedule:
    - cron: "17 13 * * *"   # every day at 13:17 UTC (about 5:17 am Pacific)
  workflow_dispatch:         # adds a "Run workflow" button on the Actions page

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-24.04   # pinned: the video renderer does not support newer images yet
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install tools
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg
          pipx install edge-tts
      - name: 1. Gather and rank the news
        run: node pipeline/news.mjs
      - name: 2. Write summaries and the video script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node pipeline/write.mjs
      - name: 3. Record the narration
        run: |
          # First choice: an online voice. If it does not answer, use the voice model that runs right here.
          if ! edge-tts --voice "$(jq -r .voice config.json)" --file work/narration.txt \
               --write-media work/voice.mp3 --write-subtitles work/voice.srt 2>/dev/null; then
            echo "::notice::Online voice unavailable; using the built-in voice instead."
            rm -f work/voice.mp3 work/voice.srt
            python3 -m venv work/venv
            work/venv/bin/pip install -q kokoro-onnx==0.6.1 soundfile
            base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
            curl -fsSL -o work/kokoro.onnx "$base/kokoro-v1.0.int8.onnx"
            curl -fsSL -o work/voices.bin "$base/voices-v1.0.bin"
            work/venv/bin/python pipeline/voice.py work/kokoro.onnx work/voices.bin "$(jq -r .backupVoice config.json)" \
              || echo "::warning::No voice could be recorded. Today's video will be silent with captions."
          fi
      - name: 4. Render the video
        run: node pipeline/render.mjs
      - name: 5. Update the site data
        run: node pipeline/finish.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: site/videos/*.mp4
          retention-days: 14
      - name: Save the edition to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/latest.json
          git commit -m "Edition $(date -u +%F)" || echo "No change"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: 6. Send the video to the social accounts
        env:
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
        run: node pipeline/post.mjs
